<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trial ended — AutoClip</title>
<link rel="icon" href="/static/favicon.ico">
<style>
  :root{--accent:#2563eb;--accent-light:#3b82f6;--bg:#07070f;--bg2:#0e0e1a;
    --border:#1e1e2e;--text:#e8e8f0;--muted:#6b6b8a}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--bg);color:var(--text);padding:24px;
    font:400 16px/1.6 system-ui,-apple-system,sans-serif}
  .card{max-width:520px;width:100%;background:var(--bg2);border:1px solid var(--border);
    border-radius:18px;padding:44px 40px;text-align:center;
    box-shadow:0 30px 80px rgba(0,0,0,.5)}
  .badge{display:inline-block;padding:5px 13px;border-radius:99px;font-size:12px;
    font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    background:rgba(220,38,38,.12);color:#f87171;border:1px solid rgba(220,38,38,.3);
    margin-bottom:20px}
  h1{margin:0 0 14px;font-size:28px;font-weight:800;letter-spacing:-.02em}
  p{margin:0 0 12px;color:var(--muted)}
  .cta{display:inline-block;margin-top:26px;padding:14px 34px;border-radius:11px;
    background:var(--accent);color:#fff;font-weight:700;text-decoration:none;font-size:16px}
  .cta:hover{background:var(--accent-light)}
  .sub{margin-top:22px;font-size:13px}
  .sub a{color:var(--muted)}
</style></head><body>
  <div class="card">
    <div class="badge">Trial ended</div>
    <h1>Your free trial has ended</h1>
    <p>Thanks for trying AutoClip. Your sessions and clips are safe &mdash; pick a plan to pick up right where you left off.</p>
    <a class="cta" href="/pricing">View plans</a>
    <div class="sub">
      <a href="/account">Account</a> &nbsp;&middot;&nbsp;
      <a href="/logout">Sign out</a> &nbsp;&middot;&nbsp;
      <a href="mailto:support@autoclip.cloud">Contact us</a>
    </div>
  </div>
</body></html>
